    h('div', { class: 'grid4' },
      tile('Real failures caught', j.failures_caught), tile('Missed (false pass)', j.false_pass),
      tile('False alarms', j.false_alarm),
      h('div', { class: 'card' }, h('div', { class: 'label', text: "Agreement (Cohen's kappa)" }),
        h('div', { class: 'tile-value', text: j.kappa == null ? 'n/a' : j.kappa.toFixed(2) }),
        h('div', { class: 'delta', text: '0 = chance, 1 = perfect' })))));
}

function groupLast(app, n) {
  const wrap = h('div', { class: 'cols' });
  [...app.children].slice(-n).forEach((e) => wrap.append(e));
  app.append(wrap);
}

// ---- page ----
function section(title, sub, ...content) {
  return h('section', { class: 'card' }, h('h2', { text: title }), h('p', { class: 'sub', text: sub }), content);
}

function renderSingleRuns(box, runs) {
  const latest = runs[runs.length - 1], prev = runs[runs.length - 2];
  box.append(h('p', { class: 'sub', text: `Latest run ${fmtDate(latest.finished_at)} - judge ${latest.judge_model || latest.model}` + (latest.assistant_model ? ` - assistant ${latest.assistant_model}` : '') + (latest.dataset_hash ? ` - dataset ${latest.dataset_hash}` : '') + ` - ${runs.length} run(s) recorded` }));
  let delta = h('div', { class: 'delta', text: 'First recorded run' });
  if (prev) {
    const d = Math.round((rate(latest) - rate(prev)) * 100);
    delta = h('div', { class: 'delta' }, h('span', { class: d > 0 ? 'up' : d < 0 ? 'down' : '', text: d > 0 ? '▲ ' : d < 0 ? '▼ ' : '– ' }),
      d === 0 ? 'No change vs previous run' : `${d > 0 ? '+' : '-'}${Math.abs(d)} pts vs previous run`);
  }
  const tile = (label, value, state) => h('div', { class: 'card' },
    h('div', { class: 'label' }, state ? statusMark(state, 14) : null, label), h('div', { class: 'tile-value', text: String(value) }));
  box.append(h('div', { class: 'kpis' },
    h('div', { class: 'card hero' }, h('div', { class: 'label', text: 'Pass rate - latest single run (valid cases)' }),
      h('div', { class: 'hero-value', text: pct(rate(latest)) }), delta),
    tile('Cases run', latest.total), tile('Passed', latest.passed, 'pass'), tile('Failed', latest.failed, 'fail'), tile('Invalid', invalidOf(latest), 'invalid'), tile('Runs recorded', runs.length)));

  box.append(section('What decided each verdict',
    'Rules are deterministic code; the judge is an LLM and can be wrong. "Rules only" marks failures the judge alone would have missed.',
    barsChart(basisRows(latest), 'Cases by what decided the verdict', ['case', 'cases'])));
  const reasons = failureReasons(latest);
  box.append(section('Why checks failed', 'Failed rule and criterion checks, by type',
    reasons.length ? barsChart(reasons, 'Failed checks by type', ['failed check', 'failed checks'])
      : h('p', { class: 'empty', text: 'No failed checks in the latest run.' })));
  groupLast(box, 2);
  box.append(section('Case details', 'Open a case to see the broken rules and failed criteria with the quoted evidence',
    latest.cases.map(caseDetails)));
}

function render() {
  const app = document.getElementById('app');
  app.append(h('h1', { text: 'AI assistant QA report' }));
  app.append(h('p', { class: 'sub', text: 'Code rules decide first, an LLM judge adds the subjective checks, and the final verdict is made by code.' }));
  const runs = [...RUNS].sort((a, b) => a.finished_at.localeCompare(b.finished_at));
  if (!runs.length && !REPEAT && !JUDGE) {
    app.append(h('p', { class: 'empty' }, 'No runs recorded yet. Run ', h('code', { text: 'python ai_evaluator.py transcripts/' }), ' first.'));
    return;
  }
  if (REPEAT) renderRepeat(app);
  if (JUDGE) renderJudge(app);
  if (!runs.length) return;
  const box = h('div', {});
  renderSingleRuns(box, runs);
  const more = h('details', { class: 'more' }, h('summary', { text: 'Latest single evaluator run - evidence per case' }), box);
  more.open = !REPEAT;
  app.append(more);
}
render();
</script>
</body>
</html>
