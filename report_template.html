<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>AI assistant QA report</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series: #2a78d6; --good: #0ca30c; --critical: #d03b3b; --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
      --series: #3987e5; --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 28px 32px 64px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  .cols > .card { margin-top: 0; min-width: 0; overflow-x: auto; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } .cols > .card { margin-top: 0; } }
  .label { display: flex; align-items: center; gap: 6px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--ink2); margin: 0; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-top: 16px; position: relative; }
  .kpis { display: grid; grid-template-columns: 1.6fr repeat(5, 1fr); gap: 12px; margin-top: 20px; }
  @media (max-width: 760px) { .kpis { grid-template-columns: 1fr 1fr; } .hero { grid-column: 1 / -1; } }
  .kpis .card { margin: 0; }
  .label { color: var(--ink2); font-size: 13px; }
  .hero-value { font-size: 56px; font-weight: 600; line-height: 1.1; margin: 4px 0; }
  .tile-value { font-size: 28px; font-weight: 600; line-height: 1.2; margin-top: 4px; }
  .delta { color: var(--ink2); font-size: 13px; }
  .delta .up { color: var(--good); } .delta .down { color: var(--critical); }
  .chart { width: 100%; height: auto; display: block; margin-top: 12px; overflow: visible; }
  .grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--muted); font-size: 12px; }
  .lbl { fill: var(--ink2); font-size: 13px; } .val { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .dot { fill: var(--series); } .ring { fill: var(--surface); }
  .bar { fill: var(--series); } .hit { fill: transparent; outline: none; }
  .bar-g { outline: none; cursor: default; }
  .bar-g:hover .bar, .bar-g:focus-visible .bar { opacity: 0.78; }
  .bar-g:focus-visible .hit, .dot-hit:focus-visible { stroke: var(--ink); stroke-width: 2; }
  .ci { stroke: var(--series); stroke-width: 8; stroke-linecap: round; opacity: 0.28; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
  @media (max-width: 760px) { .grid4 { grid-template-columns: 1fr 1fr; } }
  .grid4 .card { margin: 0; }
  .note { color: var(--ink2); font-size: 13px; margin: 10px 0 0; }
  .legend { display: flex; gap: 16px; margin-top: 10px; color: var(--ink2); font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); font-size: 13px; }
  th { color: var(--ink2); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  details.tv { margin-top: 12px; } details.tv > summary { cursor: pointer; color: var(--ink2); font-size: 13px; }
  details.more { margin-top: 20px; } details.more > summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
  details.case { border-top: 1px solid var(--grid); padding: 10px 0; }
  details.case:first-of-type { border-top: 0; }
  details.case > summary { cursor: pointer; display: flex; align-items: center; gap: 10px; list-style: none; }
  details.case > summary::-webkit-details-marker { display: none; }
  .case-name { font-weight: 600; } .chip { color: var(--ink2); font-size: 12px; border: 1px solid var(--border);
    border-radius: 999px; padding: 0 8px; } .case-meta { margin-left: auto; color: var(--ink2); font-size: 13px; }
  .case-body { margin: 10px 0 4px 30px; color: var(--ink2); }
  .case-body p { margin: 6px 0; } .case-body q { color: var(--ink); } .case-body strong { color: var(--ink); }
  #tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: 280px; }
  .tip-title { color: var(--ink2); margin-bottom: 2px; } .tip-row { display: flex; align-items: center; gap: 8px; }
  .tip-row strong { font-size: 15px; } .tip-detail { color: var(--ink2); }
  .tip-key { width: 12px; height: 2px; border-radius: 1px; display: inline-block; }
  .empty { color: var(--ink2); padding: 24px 0; }
  code { background: var(--grid); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip" hidden></div>
<script>
const DATA = __RUNS_JSON__;
const RUNS = DATA.runs, REPEAT = DATA.repeat, JUDGE = DATA.judge;

const SVGNS = 'http://www.w3.org/2000/svg';
function make(ns, tag, attrs, kids) {
  const e = ns ? document.createElementNS(ns, tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'text') e.textContent = v; else e.setAttribute(k, v);
  }
  for (const kid of (kids || []).flat(Infinity)) if (kid != null) e.append(kid);
  return e;
}
const h = (tag, attrs, ...kids) => make(null, tag, attrs, kids);
const s = (tag, attrs, ...kids) => make(SVGNS, tag, attrs, kids);

const pct = (x) => Math.round(x * 100) + '%';
const invalidOf = (run) => run.invalid || 0;
const validOf = (run) => run.total - invalidOf(run);
const rate = (run) => (validOf(run) ? run.passed / validOf(run) : 0);
const GOAL_LABEL = 'Invalid test: goal never said';
const nice = (name) => String(name || 'n/a').replace(/_/g, ' ');
const fmtDate = (iso) => new Date(iso).toLocaleString(undefined,
  { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

const KIND_LABEL = {
  expected: 'Expected behaviour not met',
  must_not: 'Forbidden behaviour happened',
  universal: 'General quality criterion failed',
};

// ---- tooltip (one shared element; always textContent) ----
const tip = document.getElementById('tip');
function showTip(x, y, c) {
  tip.replaceChildren();
  if (c.title) tip.append(h('div', { class: 'tip-title', text: c.title }));
  const row = h('div', { class: 'tip-row' });
  if (c.key) row.append(h('span', { class: 'tip-key', style: 'background:' + c.key }));
  row.append(h('strong', { text: c.value }));
  if (c.detail) row.append(h('span', { class: 'tip-detail', text: c.detail }));
  tip.append(row);
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = x + 14, top = y - r.height - 10;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top < 8) top = y + 16;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
const hideTip = () => { tip.hidden = true; };
function tipAt(el, c) { const r = el.getBoundingClientRect(); showTip(r.left + r.width / 2, r.top, c); }
function bindTip(el, getContent) {
  el.addEventListener('pointermove', (e) => showTip(e.clientX, e.clientY, getContent()));
  el.addEventListener('pointerleave', hideTip);
  el.addEventListener('focus', () => tipAt(el, getContent()));
  el.addEventListener('blur', hideTip);
}

// ---- marks ----
const MARKS = {
  pass: { fill: 'var(--good)', d: 'M6 10.5 L9 13.5 L14.5 7' },
  fail: { fill: 'var(--critical)', d: 'M7 7 L13 13 M13 7 L7 13' },
  invalid: { fill: 'var(--muted)', d: 'M6.5 10 H13.5' },
};
function statusMark(state, size) {
  const px = size || 20, mark = MARKS[state];
  return s('svg', { viewBox: '0 0 20 20', width: px, height: px, 'aria-hidden': 'true' },
    s('circle', { cx: 10, cy: 10, r: 9, fill: mark.fill }),
    s('path', { d: mark.d,
      fill: 'none', stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
}
const VERDICT_LABEL = { pass: 'Passed', fail: 'Failed', invalid: 'Invalid' };
const verdictLabel = (state) => VERDICT_LABEL[state];
const stateOf = (verdict) => verdict.toLowerCase();

// ---- horizontal bars (single series -> single colour) ----
function barsChart(rows, ariaLabel, unit) {
  const W = 720, rowH = 36, barH = 20, m = { l: 220, r: 56, t: 8, b: 8 };
  const H = m.t + m.b + rowH * rows.length, pw = W - m.l - m.r;
  const max = Math.max(...rows.map((r) => r[1]));
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': ariaLabel });
  svg.append(s('line', { x1: m.l, x2: m.l, y1: m.t, y2: H - m.b, class: 'axis' }));
  rows.forEach(([label, count], i) => {
    const top = m.t + i * rowH, y0 = top + (rowH - barH) / 2;
    const x1 = m.l + Math.max((count / max) * pw, 8);
    const g = s('g', { class: 'bar-g', tabindex: 0, 'aria-label': `${label}: ${count}` });
    g.append(s('path', { class: 'bar',
      d: `M${m.l},${y0} H${x1 - 4} Q${x1},${y0} ${x1},${y0 + 4} V${y0 + barH - 4} Q${x1},${y0 + barH} ${x1 - 4},${y0 + barH} H${m.l} Z` }));
    g.append(s('text', { x: m.l - 12, y: y0 + barH / 2 + 4, 'text-anchor': 'end', class: 'lbl', text: nice(label) }));
    g.append(s('text', { x: x1 + 8, y: y0 + barH / 2 + 4, class: 'val', text: String(count) }));
    g.append(s('rect', { x: 0, y: top, width: W, height: rowH, class: 'hit' }));
    bindTip(g, () => ({ title: nice(label), value: String(count), detail: count === 1 ? unit[0] : unit[1], key: 'var(--series)' }));
    svg.append(g);
  });
  return svg;
}

// ---- who decided the verdict ----
const BASIS_ORDER = ['rules_only', 'both', 'judge_only', 'passed', 'invalid'];
const BASIS_SHORT = { rules_only: 'Rules only', both: 'Rules + judge', judge_only: 'Judge only',
  passed: 'Passed', invalid: 'Invalid test' };
const BASIS_LONG = {
  rules_only: 'Failed because of deterministic rules. The judge alone would have passed this case.',
  both: 'Failed on both the deterministic rules and the judge.',
  judge_only: 'Failed only on the LLM judge, so this verdict is only as reliable as the judge.',
  passed: 'No rule violation and no judge objection. Absence of a violation rests on the judge.',
  invalid: 'The simulated user never said its goals, so the test is broken and the assistant was not judged.',
};
function basisOf(c) {
  if (c.verdict === 'INVALID') return 'invalid';
  if (c.verdict === 'PASS') return 'passed';
  const rules = c.violations.length > 0, judge = c.criteria.some((q) => q.status !== 'pass');
  return rules && judge ? 'both' : rules ? 'rules_only' : 'judge_only';
}
function basisRows(run) {
  const counts = {};
  run.cases.forEach((c) => { const k = basisOf(c); counts[k] = (counts[k] || 0) + 1; });
  return BASIS_ORDER.filter((k) => counts[k]).map((k) => [BASIS_SHORT[k], counts[k]]);
}

// ---- data shaping ----
function failureReasons(run) {
  const counts = new Map(), add = (k) => counts.set(k, (counts.get(k) || 0) + 1);
  for (const c of run.cases) {
    c.violations.forEach((v) => add(v.rule));
    (c.goal_coverage || []).filter((g) => g.status !== 'said').forEach(() => add(GOAL_LABEL));
    c.criteria.forEach((q) => {
      if (q.status === 'fail') add(KIND_LABEL[q.kind] || 'Criterion failed');
      else if (q.status === 'unverified') add('Judge answer unverifiable');
    });
  }
  return [...counts].sort((a, b) => b[1] - a[1]);
}

function caseDetails(c) {
  const state = stateOf(c.verdict), passed = c.criteria.filter((q) => q.status === 'pass').length;
  const body = h('div', { class: 'case-body' });
  body.append(h('p', {}, h('strong', { text: 'Verdict basis: ' }), BASIS_LONG[basisOf(c)]));
  (c.goal_coverage || []).filter((g) => g.status !== 'said').forEach((g) => body.append(h('p', {},
    h('strong', { text: 'Goal never said by the simulated user: ' + g.goal }), ' ', g.reason)));
  c.violations.forEach((v) => body.append(h('p', {},
    h('strong', { text: 'Rule broken: ' }), `${nice(v.rule)} (turn ${v.turn}) - `, h('q', { text: v.evidence }))));
  c.criteria.filter((q) => q.status !== 'pass').forEach((q) => body.append(h('p', {},
    h('strong', { text: (q.status === 'unverified' ? 'Unverified: ' : q.kind === 'expected' ? 'Failed: ' : 'Violated: ') + q.statement }), ' ',
    q.reason ? q.reason : q.quote ? h('q', { text: q.quote }) : '(no quote given)')));
  if (state === 'pass') body.append(h('p', { text: 'Every rule and criterion held.' }));
  return h('details', { class: 'case' },
    h('summary', {}, statusMark(state), h('span', { class: 'case-name', text: c.test_name }),
      h('span', { class: 'chip', text: nice(c.category) }), h('span', { class: 'chip', text: BASIS_SHORT[basisOf(c)] }), h('span', { class: 'case-meta', text: state === 'invalid'
        ? `Invalid test - assistant not judged - ${c.violations.length} rule violation(s)`
        : `${verdictLabel(state)} - criteria ${passed}/${c.criteria.length} - ${c.violations.length} rule violation(s)` })),
    body);
}


// ---- repeat runs: per-case pass rate with interval ----
const LAYER = { rule: 'Rule (code)', judge: 'LLM judge', test: 'Broken test' };
function intervalChart(rows, nRuns, perRun) {
  const W = 1100, rowH = 36, STEP = 20, m = { l: 260, r: 76 + STEP * nRuns, t: 24, b: 8 };
  const pw = W - m.l - m.r, H = m.t + m.b + rowH * rows.length;
  const x = (v) => m.l + pw * v;
  const svg = s('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img',
    'aria-label': `Pass rate per case over ${nRuns} runs, with 95% intervals` });
  for (const g of [0, 0.5, 1]) {
    svg.append(s('line', { x1: x(g), x2: x(g), y1: m.t - 4, y2: H - m.b, class: g === 0 ? 'axis' : 'grid' }));
    svg.append(s('text', { x: x(g), y: m.t - 10, 'text-anchor': 'middle', class: 'tick', text: g * 100 + '%' }));
  }
  rows.forEach((r, i) => {
    const cy = m.t + i * rowH + rowH / 2, valid = r.pass + r.fail;
    const g = s('g', { class: 'bar-g', tabindex: 0,
      'aria-label': `${nice(r.test_name)}: ` + (valid ? `${r.pass} of ${valid} valid runs passed` : 'no valid run') });
    g.append(s('text', { x: m.l - 12, y: cy + 4, 'text-anchor': 'end', class: 'lbl', text: nice(r.test_name) }));
    if (valid) {
      g.append(s('line', { x1: x(r.ci95[0]), x2: x(r.ci95[1]), y1: cy, y2: cy, class: 'ci' }));
      g.append(s('circle', { cx: x(r.rate), cy, r: 7, class: 'ring' }));
      g.append(s('circle', { cx: x(r.rate), cy, r: 5, class: 'dot' }));
      g.append(s('text', { x: W - 52, y: cy + 4, class: 'val', text: `${r.pass}/${valid}` }));
    } else {
      g.append(s('text', { x: m.l + 8, y: cy + 4, class: 'tick', text: 'no valid run (the test itself is broken)' }));
    }
    perRun.forEach((run, j) => {
      const v = run[r.test_name];
      if (!v) return;
      const mark = statusMark(v === 'PASS' ? 'pass' : v === 'FAIL' ? 'fail' : 'invalid', 16);
      mark.setAttribute('x', W - m.r + 14 + j * STEP); mark.setAttribute('y', cy - 8);
      g.append(mark);
    });
    g.append(s('rect', { x: 0, y: cy - rowH / 2, width: W, height: rowH, class: 'hit' }));
    bindTip(g, () => ({ title: nice(r.test_name),
      value: valid ? `${r.pass} of ${valid} valid runs passed` : 'no valid run',
      detail: (valid ? `95% interval ${pct(r.ci95[0])}-${pct(r.ci95[1])}` : '') + (r.invalid ? ` ${r.invalid} invalid` : ''),
      key: 'var(--series)' }));
    svg.append(g);
  });
  return svg;
}
function repeatReasons(repeat) {
  const n = repeat.runs.length, per = {};
  (repeat.reasons || []).forEach((run) => Object.entries(run).forEach(([name, list]) => {
    const m = per[name] || (per[name] = new Map());
    new Set(list).forEach((r) => m.set(r, (m.get(r) || 0) + 1));
  }));
  return Object.keys(per).filter((k) => per[k].size).sort().map((name) => h('details', { class: 'case' },
    h('summary', {}, h('span', { class: 'case-name', text: nice(name) }),
      h('span', { class: 'case-meta', text: `${per[name].size} reason(s)` })),
    h('div', { class: 'case-body' }, [...per[name]].sort((a, b) => b[1] - a[1]).map(([reason, count]) => {
      const i = reason.indexOf(':'), layer = reason.slice(0, i);
      return h('p', {}, h('span', { class: 'chip', text: LAYER[layer] || layer }), ` ${count} of ${n} runs - `, nice(reason.slice(i + 1)));
    }))));
}
function renderRepeat(app) {
  const n = REPEAT.runs.length, all = REPEAT.summary;
  const rows = [...all].sort((x, y) => (x.rate == null) - (y.rate == null) || (x.rate || 0) - (y.rate || 0));
  const count = (f) => all.filter(f).length;
  const tile = (label, value, state) => h('div', { class: 'card' },
    h('div', { class: 'label' }, state ? statusMark(state, 14) : null, label), h('div', { class: 'tile-value', text: String(value) }));
  const valid = (r) => r.pass + r.fail;
  app.append(section(`Repeat runs - ${all.length} cases x ${n} runs`,
    'One run of a non-deterministic system is noise, so every case ran several times. Dot = pass rate, bar = 95% interval, worst case first.',
    h('div', { class: 'grid4' },
      tile('Never passed', count((r) => valid(r) && !r.pass), 'fail'),
      tile('Sometimes passed', count((r) => r.pass && r.fail)),
      tile('Always passed', count((r) => valid(r) && !r.fail), 'pass'),
      tile('Broken tests (no valid run)', count((r) => !valid(r)), 'invalid')),
    intervalChart(rows, n, REPEAT.runs),
    h('details', { class: 'tv' }, h('summary', { text: 'Why each case did not pass' }), repeatReasons(REPEAT))));
}

// ---- judge vs human ----
function renderJudge(app) {
  const j = JUDGE;
  const tile = (label, r) => h('div', { class: 'card' }, h('div', { class: 'label', text: label }),
    h('div', { class: 'tile-value', text: r.rate == null ? 'n/a' : pct(r.rate) }),
    h('div', { class: 'delta', text: `${r.k} of ${r.n}` + (r.rate == null ? '' : ` - 95% interval ${pct(r.ci95[0])}-${pct(r.ci95[1])}`) }));
  app.append(section('Can the judge be trusted? Judge vs hand labels',
    `${j.items_used} conversations, ${j.criteria_judged} criteria labeled by one person; judge ${j.judge_model || 'n/a'}. Small sample: read the intervals, not just the numbers.`,
    h('div', { class: 'grid4' },
      tile('Real failures caught', j.failures_caught), tile('Missed (false pass)', j.false_pass),
      tile('False alarms', j.false_alarm),
      h('div', { class: 'card' }, h('div', { class: 'label', text: "Agreement (Cohen's kappa)" }),
        h('div', { class: 'tile-value', text: j.kappa == null ? 'n/a' : j.kappa.toFixed(2) }),
        h('div', { class: 'delta', text: '0 = chance, 1 = perfect' })))));
}

function groupLast(app, n) {
  const wrap = h('div', { class: 'cols' });
  [...app.children].slice(-n).forEach((e) => wrap.append(e));
  app.append(wrap);
}

// ---- page ----
function section(title, sub, ...content) {
  return h('section', { class: 'card' }, h('h2', { text: title }), h('p', { class: 'sub', text: sub }), content);
}

function renderSingleRuns(box, runs) {
  const latest = runs[runs.length - 1], prev = runs[runs.length - 2];
  box.append(h('p', { class: 'sub', text: `Latest run ${fmtDate(latest.finished_at)} - judge ${latest.judge_model || latest.model}` + (latest.assistant_model ? ` - assistant ${latest.assistant_model}` : '') + (latest.dataset_hash ? ` - dataset ${latest.dataset_hash}` : '') + ` - ${runs.length} run(s) recorded` }));
  let delta = h('div', { class: 'delta', text: 'First recorded run' });
  if (prev) {
    const d = Math.round((rate(latest) - rate(prev)) * 100);
    delta = h('div', { class: 'delta' }, h('span', { class: d > 0 ? 'up' : d < 0 ? 'down' : '', text: d > 0 ? '▲ ' : d < 0 ? '▼ ' : '– ' }),
      d === 0 ? 'No change vs previous run' : `${d > 0 ? '+' : '-'}${Math.abs(d)} pts vs previous run`);
  }
  const tile = (label, value, state) => h('div', { class: 'card' },
    h('div', { class: 'label' }, state ? statusMark(state, 14) : null, label), h('div', { class: 'tile-value', text: String(value) }));
  box.append(h('div', { class: 'kpis' },
    h('div', { class: 'card hero' }, h('div', { class: 'label', text: 'Pass rate - latest single run (valid cases)' }),
      h('div', { class: 'hero-value', text: pct(rate(latest)) }), delta),
    tile('Cases run', latest.total), tile('Passed', latest.passed, 'pass'), tile('Failed', latest.failed, 'fail'), tile('Invalid', invalidOf(latest), 'invalid'), tile('Runs recorded', runs.length)));

  box.append(section('What decided each verdict',
    'Rules are deterministic code; the judge is an LLM and can be wrong. "Rules only" marks failures the judge alone would have missed.',
    barsChart(basisRows(latest), 'Cases by what decided the verdict', ['case', 'cases'])));
  const reasons = failureReasons(latest);
  box.append(section('Why checks failed', 'Failed rule and criterion checks, by type',
    reasons.length ? barsChart(reasons, 'Failed checks by type', ['failed check', 'failed checks'])
      : h('p', { class: 'empty', text: 'No failed checks in the latest run.' })));
  groupLast(box, 2);
  box.append(section('Case details', 'Open a case to see the broken rules and failed criteria with the quoted evidence',
    latest.cases.map(caseDetails)));
}

function render() {
  const app = document.getElementById('app');
  app.append(h('h1', { text: 'AI assistant QA report' }));
  app.append(h('p', { class: 'sub', text: 'Code rules decide first, an LLM judge adds the subjective checks, and the final verdict is made by code.' }));
  const runs = [...RUNS].sort((a, b) => a.finished_at.localeCompare(b.finished_at));
  if (!runs.length && !REPEAT && !JUDGE) {
    app.append(h('p', { class: 'empty' }, 'No runs recorded yet. Run ', h('code', { text: 'python ai_evaluator.py transcripts/' }), ' first.'));
    return;
  }
  if (REPEAT) renderRepeat(app);
  if (JUDGE) renderJudge(app);
  if (!runs.length) return;
  const box = h('div', {});
  renderSingleRuns(box, runs);
  const more = h('details', { class: 'more' }, h('summary', { text: 'Latest single evaluator run - evidence per case' }), box);
  more.open = !REPEAT;
  app.append(more);
}
render();
</script>
</body>
</html>
